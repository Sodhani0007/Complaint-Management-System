server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React SPA fallback — any non-file route serves index.html so client-side
    # routing (if added later) doesn't 404 on refresh.
    location / {
        try_files $uri /index.html;
    }

    # Proxies to the backend service name from docker-compose, mirroring the
    # /api proxy vite.config.ts uses in local dev — same contract, different
    # transport, so nothing in the frontend code needs to change between
    # `npm run dev` and the containerized build.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
